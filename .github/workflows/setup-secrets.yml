name: Setup Hugging Face Secrets

on:
  workflow_dispatch:
    inputs:
      hf_token:
        description: 'Your Hugging Face API Token'
        required: true
        default: ''

jobs:
  setup:
    runs-on: macos-latest
    
    steps:
    - name: Create Secret
      run: |
        echo "Creating HF_TOKEN secret..."
        # This workflow will help you set up the secret manually
        # Go to: Settings -> Secrets and variables -> Actions -> New repository secret
        # Name: HF_TOKEN
        # Value: (paste your token here)
        
        echo "After setting the secret, run:"
        echo "  git commit -m 'Add HF_TOKEN'"
        echo "  git push origin main"
