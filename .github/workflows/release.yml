name: Release Seed-VC iPad App

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch torchaudio transformers coremltools munch audiotools dac huggingface_hub
        
    - name: Convert models to CoreML
      run: |
        python .github/workflows/convert_to_coreml.py
    
    - name: Create Xcode project
      run: |
        xcodeproj create VoiceConverterApp --language Swift
        
    - name: Add CoreML models to app bundle
      run: |
        mkdir -p VoiceConverterApp.app/Contents/Resources
        cp -r SeedVC/CoreMLModels/* VoiceConverterApp.app/Contents/Resources/
        
    - name: Build iOS App
      run: |
        xcodebuild -scheme VoiceConverterApp \
          -destination 'platform=iOS Simulator,name=iPad Pro (12.9-inch) (4th generation)' \
          build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
        
    - name: Create distribution package
      run: |
        # Create ZIP of the app
        cd Build/Products/Release-iphoneos
        zip -r ../VoiceConverterApp.zip VoiceConverterApp.app
        
        # Create ZIP of CoreML models
        cd ../../SeedVC/CoreMLModels
        zip -r ../../CoreMLModels.zip *.mlmodel
        
    - name: Upload Release Assets
      uses: softprops/action-gh-release@v3
      with:
        files: |
          Build/Products/Release-iphoneos/VoiceConverterApp.zip
          SeedVC/CoreMLModels/CoreMLModels.zip
        draft: true
        generate_release_notes: true
        body: |
          ## Release Notes for v${{ github.ref_name }}
          
          ### Features
          - Voice conversion using Seed-VC CoreML models
          - Offline operation with privacy protection
          - Support for iPad and iPhone
            
          ### Technical Details
          - Whisper Feature Extractor for audio analysis
          - DiT model for voice conversion
          - BigVGAN vocoder for high-quality audio regeneration
          
          ### Requirements
          - iOS 15.0+
          - Xcode 14.0+
