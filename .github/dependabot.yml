version: 2
updates:
  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      prefix-development: "ci(chore)"

  # Python dependencies (for CoreML conversion)
  - package-ecosystem: "pip"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
      prefix-development: "deps(dev)"
    
  # Swift dependencies (if using Package.swift)
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
